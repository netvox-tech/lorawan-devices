name: R718S Series - Environmental Sensor

hardwareVersions:
  - version: '1'
    numeric: 1

firmwareVersions:
  - version: '1'
    numeric: 1
    hardwareVersions:
      - '1'
    profiles:
      EU863-870:
        id: profile-eu868
        codec: r718s-codec
      AS923:
        id: profile-as923
        codec: r718s-codec
      US902-928:
        id: profile-us915
        codec: r718s-codec
      AU915-928:
        id: profile-au915
        codec: r718s-codec
      KR920-923:
        id: profile-kr920
        codec: r718s-codec
      IN865-867:
        id: profile-in865
        codec: r718s-codec
      CN470-510:
        id: profile-cn470
        codec: r718s-codec

sensors:
  - temperature
  - humidity
  - battery
  - pm2.5
  - pm10
  - o3
  - co
  - no
  - no2
  - so2
  - h2s
  - co2
  - ph

battery:
  type: replaceable battery
  replaceable: true

operatingConditions:
  temperature:
    min: -20
    max: 55
  relativeHumidity:
    min: 0
    max: 0.9

keyProvisioning:
  - custom
  - join server

keySecurity: none

productURL: http://www.netvox.com.tw/product.asp?pro=R718S

dataSheetURL: http://www.netvox.com.tw/um/R718S/R718Sdatasheet.pdf

photos:
  main: photos/r718s.jpg
