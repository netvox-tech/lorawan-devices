name: R726 Series - Multi-sensor Gateway
description: R726 Series is a multi-sensor gateway that supports various environmental sensors including PM2.5, PM10, CO, NO, NO2, SO2, H2S, O3, NH3, temperature, humidity, wind speed, wind direction, atmospheric pressure, VOC, soil moisture, soil temperature, soil EC, pH, ORP, NTU, water level, and residual chlorine.

