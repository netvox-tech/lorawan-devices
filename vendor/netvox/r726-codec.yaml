        bytes: [0x0A, 0x09, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'SetSoilTypeReq'
          Device: 'R726 Series'
          SoilType: 1

    - description: Get soil type request
