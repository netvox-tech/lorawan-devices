name: R718PD - Wireless RS232 Adaptor
description: The R718PD is a Class C type device based on the LoRaWAN open protocol of Netvox and is compatible with the LoRaWAN protocol.The R718PD can transmit the serial port transparently and directly report the information received by the serial port to the corresponding gateway. Serial port transparent transmission only supports RS-232 protocol.

