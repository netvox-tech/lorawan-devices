        fPort: 6
        bytes: [0x01, 0x61, 0x05, 0x77, 0x00, 0x64, 0x00, 0x32, 0x00, 0x1E, 0x00]
      output:
        data:
          Device: 'R718U'
          Volt: 11.9
          O3: 10.0
          CO: 5.0
          NO: 3.0

    - description: Gas report (NO2, SO2, H2S)
