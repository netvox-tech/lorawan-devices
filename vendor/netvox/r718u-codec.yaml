      output:
        data:
          Device: 'R718U'
          Volt: 11.9
          PM1_0: 10
          PM2_5: 20
          PM10: 100

    - description: PM UM report
      input:
        fPort: 6
        bytes: [0x01, 0x61, 0x03, 0x77, 0x00, 0x0A, 0x00, 0x14, 0x00, 0x64, 0x00]
      output:
        data:
          Device: 'R718U'
          Volt: 11.9
          PM0_3UM: 2570
          PM0_5UM: 20
          PM1_0UM: 100

    - description: PM UM size report
      input:
        fPort: 6
        bytes: [0x01, 0x61, 0x04, 0x77, 0x00, 0x14, 0x00, 0x28, 0x00, 0x64, 0x00]
