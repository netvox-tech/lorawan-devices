        fPort: 6
        bytes: [0x01, 0x61, 0x06, 0x77, 0x00, 0x64, 0x00, 0x32, 0x00, 0x1E, 0x00]
      output:
        data:
          Device: 'R718U'
          Volt: 11.9
          NO2: 10.0
          SO2: 50
          H2S: 3.0

    - description: Gas report (CO2, NH3, Noise)
      input:
        fPort: 6
        bytes: [0x01, 0x61, 0x07, 0x77, 0x03, 0xE8, 0x00, 0x64, 0x00, 0x32, 0x00]
      output:
        data:
          Device: 'R718U'
          Volt: 11.9
          CO2_0_1: 100.0
          NH3: 10.0
          Noise: 5.0

    - description: PH report
      input:
        fPort: 6
        bytes: [0x01, 0x61, 0x08, 0x77, 0x02, 0x58, 0x01, 0x2C, 0x00, 0xC8, 0x00]
      output:
        data:
          Device: 'R718U'
          Volt: 11.9
          PH: 6.0
          TemperaturewithPH: 3.0
          ORP: 200

    - description: NTU report
      input:
        fPort: 6
        bytes: [0x01, 0x61, 0x09, 0x77, 0x00, 0x64, 0x01, 0x2C, 0x00, 0x64, 0x00]
      output:
        data:
          Device: 'R718U'
          Volt: 11.9
          NTU: 10.0
          TemperaturewithNTU: 3.0
          Soil_VWC: 1.0

    - description: Soil report
      input:
        fPort: 6
        bytes: [0x01, 0x61, 0x0A, 0x77, 0x00, 0x64, 0x01, 0x2C, 0x00, 0x32, 0x05]
      output:
        data:
          Device: 'R718U'
          Volt: 11.9
          Soil_VWC: 1.0
          Soil_Temperature: 3.0
          WaterLevel: 50
          Soil_EC: 0.5

    - description: LDO report
      input:
        fPort: 6
        bytes: [0x01, 0x61, 0x0B, 0x77, 0x01, 0x2C, 0x00, 0x64, 0x00, 0x32, 0x00]
      output:
        data:
          Device: 'R718U'
          Volt: 11.9
          TemperaturewithLDO: 3.0
          LDODOValue: 1.0
          LDOSatValue: 5.0

    - description: Temperature, Humidity, WindSpeed report
      input:
        fPort: 6
        bytes: [0x01, 0x61, 0x0C, 0x77, 0x01, 0x2C, 0x00, 0x64, 0x00, 0x32, 0x00]
      output:
        data:
          Device: 'R718U'
          Volt: 11.9
          Temperature_2Bytes_0_01: 3.0
          Humidity_2Byte_0_01: 1.0
          WindSpeed: 0.5

    - description: WindDirection, Atomsphere report
      input:
        fPort: 6
        bytes: [0x01, 0x61, 0x0D, 0x77, 0x00, 0xC8, 0x00, 0x01, 0x00, 0x00, 0x00]
      output:
        data:
          Device: 'R718U'
          Volt: 11.9
          WindDirection: 200
          Atomsphere: 655.36

    - description: VOC report
