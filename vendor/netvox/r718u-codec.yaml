uplinkDecoder:
  fileName: payload/r718u.js
  examples:
    - description: Startup version report
      input:
        fPort: 6
        bytes: [0x01, 0x61, 0x00, 0x11, 0x04, 0x20, 0x23, 0x09, 0x11, 0x00, 0x00]
      output:
        data:
          Device: 'R718U'
          SWver: 1.1
          HWver: 4
          Datecode: '20230911'

    - description: PM CF report
      input:
        fPort: 6
        bytes: [0x01, 0x61, 0x01, 0x77, 0x00, 0x0A, 0x00, 0x14, 0x00, 0x64, 0x00]
      output:
        data:
          Device: 'R718U'
          Volt: 11.9
          PM1_0_CF: 10
          PM2_5_CF: 20
          PM10_CF: 100

    - description: PM report
      input:
        fPort: 6
