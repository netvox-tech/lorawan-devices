    - description: ReadConfigReportRsp
      input:
        fPort: 7
        bytes: [0x82, 0x61, 0x00, 0x0A, 0x00, 0x64, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'ReadConfigReportRsp'
          Device: 'R718U'
          MinTime: 10
          MaxTime: 100

    - description: SetLDOSettingRsp
      input:
        fPort: 7
        bytes: [0x83, 0x61, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'SetLDOSettingRsp'
          Device: 'R718U'
          Status: 'Success'

    - description: GetLDOSettingRsp
      input:
        fPort: 7
        bytes: [0x84, 0x61, 0x00, 0x64, 0x00, 0xC8, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'GetLDOSettingRsp'
          Device: 'R718U'
          LDOsAltiud: 1.0
          LDOsPSU: 2.0

    - description: ORPCalibrateRsp
      input:
        fPort: 7
        bytes: [0x85, 0x61, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'ORPCalibrateRsp'
          Device: 'R718U'
          Status: 'Success'

    - description: PHCalibrateRsp
      input:
        fPort: 7
        bytes: [0x86, 0x61, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'PHCalibrateRsp'
          Device: 'R718U'
          Status: 'Failure'

    - description: NTUCalibrateRsp
      input:
        fPort: 7
        bytes: [0x87, 0x61, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'NTUCalibrateRsp'
          Device: 'R718U'
          Status: 'Success'

    - description: SetWireLengthRsp
      input:
        fPort: 7
        bytes: [0x88, 0x61, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'SetWireLengthRsp'
          Device: 'R718U'
          Status: 'Success'

    - description: GetWireLengthRsp
      input:
        fPort: 7
        bytes: [0x89, 0x61, 0x00, 0x64, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'GetWireLengthRsp'
          Device: 'R718U'
          Length: 10.0

    - description: SetSoilTypeRsp
      input:
        fPort: 7
        bytes: [0x8A, 0x61, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'SetSoilTypeRsp'
          Device: 'R718U'
          Status: 'Success'

    - description: GetSoilTypeRsp
      input:
        fPort: 7
        bytes: [0x8B, 0x61, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'GetSoilTypeRsp'
          Device: 'R718U'
          SoilType: 2

    - description: SoilCalibrateRsp
      input:
        fPort: 7
        bytes: [0x8C, 0x61, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'SoilCalibrateRsp'
          Device: 'R718U'
          Status: 'Success'

