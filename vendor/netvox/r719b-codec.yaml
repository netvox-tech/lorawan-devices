uplinkDecoder:
  fileName: payload/r719b.js
  examples:
    - description: Startup version report
      input:
        fPort: 6
        bytes: [0x01, 0xAF, 0x00, 0x64, 0x0B, 0x20, 0x20, 0x04, 0x24, 0x00, 0x00]
      output:
        data:
          Device: 'R719B'
          SWver: 10
          HWver: 11
          Datecode: '20200424'

    - description: Status report
      input:
        fPort: 6
        bytes: [0x01, 0xAF, 0x01, 0x1E, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Device: 'R719B'
          Volt: 3
          CarOnOff: 1

    - description: Configure report response
      input:
        fPort: 7
        bytes: [0x81, 0xAF, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'ConfigReportRsp'
          Device: 'R719B'
          Status: 'Success'

    - description: Read configure report response
      input:
        fPort: 7
        bytes: [0x82, 0xAF, 0x03, 0x84, 0x07, 0x08, 0x01, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'ReadConfigReportRsp'
          Device: 'R719B'
          MinTime: 900
          MaxTime: 1800
          BatteryChange: 0.1

    - description: Set detect threshold response
      input:
        fPort: 7
        bytes: [0x83, 0xAF, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'SetDetectThresholdRsp'
          Device: 'R719B'
          Status: 'Success'

    - description: Get detect threshold response
      input:
        fPort: 7
        bytes: [0x84, 0xAF, 0x00, 0x64, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'GetDetectThresholdRsp'
          Device: 'R719B'
          DetectThreshold: 100

    - description: Reset off car magnet response
      input:
        fPort: 7
        bytes: [0x8B, 0xAF, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'ReSetOffCarMagnetRsp'
          Device: 'R719B'
          Status: 'Success'

