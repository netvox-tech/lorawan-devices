downlinkEncoder:
  fileName: payload/r719b.js
  examples:
    - description: Configure report request
      input:
        data:
          Cmd: 'ConfigReportReq'
          Device: 'R719B'
          MinTime: 900
          MaxTime: 1800
          BatteryChange: 0.1
      output:
        fPort: 7
        bytes: [0x01, 0xAF, 0x03, 0x84, 0x07, 0x08, 0x01, 0x00, 0x00, 0x00, 0x00]

    - description: Read configure report request
      input:
        data:
          Cmd: 'ReadConfigReportReq'
          Device: 'R719B'
      output:
        fPort: 7
        bytes: [0x02, 0xAF, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

    - description: Set detect threshold request
      input:
        data:
          Cmd: 'SetDetectThresholdReq'
          Device: 'R719B'
          DetectThreshold: 100
      output:
        fPort: 7
        bytes: [0x03, 0xAF, 0x00, 0x64, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

    - description: Get detect threshold request
      input:
        data:
          Cmd: 'GetDetectThresholdReq'
          Device: 'R719B'
      output:
        fPort: 7
        bytes: [0x04, 0xAF, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

    - description: Reset off car magnet request
      input:
        data:
          Cmd: 'ReSetOffCarMagnetReq'
          Device: 'R719B'
      output:
        fPort: 7
        bytes: [0x0B, 0xAF, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
