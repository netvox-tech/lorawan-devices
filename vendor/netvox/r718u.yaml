name: R718U Series - Multi-sensor IoT Device
description: The R718U Series is a multi-sensor IoT device that supports various environmental measurements including PM sensors, gas sensors, pH, ORP, NTU, soil moisture, temperature, humidity, wind speed, wind direction, atmospheric pressure, VOC, and more. It uses LoRaWAN communication protocol to transmit data.

