name: R718WD - Wireless Liquid Level Sensor
description: R718WD is a wireless communication device for liquid level detection. R718WD can detect the level of liquid position through the external liquid level sensing line, and transmits the detected data to other devices for display through wireless network. It adopts SX1276 wireless communication module.

