    numeric: 1
    hardwareVersions:
      - '1'
    profiles:
      EU863-870:
        id: profile-eu868
        codec: r718ra-codec
      AS923:
        id: profile-as923
        codec: r718ra-codec
      US902-928:
        id: profile-us915
        codec: r718ra-codec
      AU915-928:
