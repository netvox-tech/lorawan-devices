        fPort: 7
        bytes: [0x04, 0x8F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'GetSensorParaReq'
          Device: 'R718WE'

downlinkEncoder:
  fileName: payload/r718we.js
  examples:
    - description: Configure report request
      input:
        data:
          Cmd: 'ConfigReportReq'
          Device: 'R718WE'
          MinTime: 900
          MaxTime: 1800
      output:
        fPort: 7
        bytes: [0x01, 0x8F, 0x03, 0x84, 0x07, 0x08, 0x00, 0x00, 0x00, 0x00, 0x00]

    - description: Read configure report request
      input:
        data:
          Cmd: 'ReadConfigReportReq'
          Device: 'R718WE'
      output:
        fPort: 7
        bytes: [0x02, 0x8F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

    - description: Set sensor parameter request
      input:
        data:
          Cmd: 'SetSensorParaReq'
          Device: 'R718WE'
          LineLength: 1000
          Sensitivity: 2
      output:
        fPort: 7
        bytes: [0x03, 0x8F, 0x03, 0xE8, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

    - description: Get sensor parameter request
      input:
        data:
          Cmd: 'GetSensorParaReq'
          Device: 'R718WE'
      output:
        fPort: 7
        bytes: [0x04, 0x8F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
