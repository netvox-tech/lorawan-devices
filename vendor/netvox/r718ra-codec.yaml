---
# R718RA Series Codec for The Things Network

uplinkDecoder:
  fileName: payload/r718ra.js
  examples:
    - description: Version report
      input:
        fPort: 6
        bytes: [0x01, 0xC6, 0x00, 0x01, 0x02, 0x20, 0x21, 0x03, 0x22]
      output:
        data:
          Device: 'R718RA Series'
          Cmd: 'VersionReport'
          SoftwareVersion: '0x01'
          HardwareVersion: '0x02'
          DateCode: '20210322'

    - description: Gas measurement report
      input:
        fPort: 6
        bytes: [0x01, 0xC6, 0x01, 0x05, 0x01, 0x00, 0x01, 0x86, 0xA0]
      output:
        data:
          Device: 'R718RA Series'
          Cmd: 'GasMeasurement'
          Battery: 0.5
          GasType: 1
          GasppmValue: 100.0

    - description: Temperature and humidity report
      input:
        fPort: 6
        bytes: [0x01, 0xC6, 0x02, 0x05, 0x00, 0xFA, 0x01, 0x2C]
      output:
        data:
          Device: 'R718RA Series'
          Cmd: 'TempHumidity'
          Battery: 0.5
          Temperature: 25.0
          Humidity: 30.0

    - description: Configure report response
      input:
        fPort: 7
        bytes: [0x81, 0xC6, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Device: 'R718RA Series'
          Cmd: 'ConfigReportRsp'
          Status: 'Success'

    - description: Read configure report response with gas ppm change
      input:
        fPort: 7
        bytes: [0x82, 0xC6, 0x00, 0x03, 0x84, 0x07, 0x08, 0x01, 0x00, 0x00, 0x03, 0xE8]
      output:
        data:
          Device: 'R718RA Series'
          Cmd: 'ReadConfigReportRsp'
          MinTime: 900
          MaxTime: 1800
          BatteryChange: 0.1
          Gasppmchange: 100.0

downlinkEncoder:
  fileName: payload/r718ra.js
  examples:
    - description: Configure report request
      input:
        data:
          Cmd: 'ConfigReportReq'
          Device: 'R718RA Series'
          MinTime: 900
          MaxTime: 1800
          BatteryChange: 0.1
          Gasppmchange: 100.0
      output:
        fPort: 7
        bytes: [0x01, 0xC6, 0x03, 0x84, 0x07, 0x08, 0x01, 0x00, 0x03, 0xE8]

    - description: Read configure report request
      input:
        data:
          Cmd: 'ReadConfigReportReq'
          Device: 'R718RA Series'
      output:
        fPort: 7
        bytes: [0x02, 0xC6, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

downlinkDecoder:
  fileName: payload/r718ra.js
  examples:
    - description: Configure report request
      input:
        fPort: 7
        bytes: [0x01, 0xC6, 0x03, 0x84, 0x07, 0x08, 0x01, 0x00, 0x00, 0x03, 0xE8]
      output:
        data:
          Device: 'R718RA Series'
          Cmd: 'ConfigReportReq'
          MinTime: 900
          MaxTime: 1800
          BatteryChange: 0.1
          Gasppmchange: 100.0

    - description: Read configure report request
      input:
        fPort: 7
        bytes: [0x02, 0xC6, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Device: 'R718RA Series'
          Cmd: 'ReadConfigReportReq'
