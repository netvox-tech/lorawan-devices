uplinkDecoder:
  fileName: payload/r718z.js
  examples:
    - description: Startup version report
      input:
        fPort: 6
        bytes: [0x01, 0xB6, 0x00, 0x64, 0x01, 0x20, 0x20, 0x07, 0x29, 0x00, 0x00]
      output:
        data:
          Device: 'R718Z'
          SWver: 10
          HWver: 1
          Datecode: '20200729'

    - description: Status report
      input:
        fPort: 6
        bytes: [0x01, 0xB6, 0x01, 0x24, 0x01, 0x07, 0xD0, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Device: 'R718Z'
          Volt: 3.6
          Status: 'ON'
          Distance: 2000

    - description: Configure report response
      input:
        fPort: 7
        bytes: [0x81, 0xB6, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'ConfigReportRsp'
          Device: 'R718Z'
          Status: 'Success'

    - description: Read configure report response
      input:
        fPort: 7
        bytes: [0x82, 0xB6, 0x03, 0x84, 0x07, 0x08, 0x01, 0x00, 0x05, 0x00, 0x00]
      output:
        data:
          Cmd: 'ReadConfigReportRsp'
          Device: 'R718Z'
          MinTime: 900
          MaxTime: 1800
          BatteryChange: 0.1
          DistanceChange: 5

    - description: Set on distance threshold response
      input:
        fPort: 7
        bytes: [0x83, 0xB6, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'SetOnDistanceThresholdRsp'
          Device: 'R718Z'
          Status: 'Success'

    - description: Get on distance threshold response
      input:
        fPort: 7
        bytes: [0x84, 0xB6, 0x07, 0xD0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        data:
          Cmd: 'GetOnDistanceThresholdRsp'
          Device: 'R718Z'
          OnDistanceThreshold_mm: 2000

